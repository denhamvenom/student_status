document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

--metal-100:#EDEEEF;\n--metal-300:#C9CCCF;\n--metal-500:#9A9EA3;\n--metal-700:#5B5F63;\n\n--color-primary:var(--gold-500);\n--color-primary-hover:var(--gold-600);\n--color-secondary:var(--purple-700);\n--color-secondary-hover:var(--purple-900);\n--color-dark:var(--gray-900);\n\n--surface-page:var(--white);\n--surface-card:var(--white);\n--surface-dark:var(--gray-900);\n--surface-purple:var(--purple-700);\n--surface-metal:var(--metal-100);\n\n--text-body:var(--gray-900);\n--text-muted:var(--gray-500);\n--text-on-dark:var(--white);\n--text-on-gold:var(--gray-900);\n--text-on-purple:var(--white);\n--text-link:var(--purple-700);\n--text-link-hover:var(--purple-900);\n\n--border-default:var(--metal-300);\n--border-dark:var(--gray-900);\n}\n\n:root{\n--font-display:\"Canaith\",\"Nasalization\",sans-serif;\n--font-heading:\"Anton\",sans-serif;\n--font-technical:\"Nasalization\",sans-serif;\n--font-body:\"Segoe UI\",system-ui,-apple-system,\"Helvetica Neue\",Arial,sans-serif;\n\n--text-xs:0.75rem;\n--text-sm:0.875rem;\n--text-base:1rem;\n--text-md:1.125rem;\n--text-lg:1.375rem;\n--text-xl:1.75rem;\n--text-2xl:2.25rem;\n--text-3xl:3rem;\n--text-4xl:4rem;\n--text-5xl:5.5rem;\n\n--leading-tight:1.1;\n--leading-normal:1.4;\n--leading-relaxed:1.7;\n\n--tracking-wide:0.04em;\n--tracking-wider:0.08em;\n}\n\n:root{\n--space-1:4px;\n--space-2:8px;\n--space-3:12px;\n--space-4:16px;\n--space-5:24px;\n--space-6:32px;\n--space-7:48px;\n--space-8:64px;\n--space-9:96px;\n--space-10:128px;\n\n--radius-sm:4px;\n--radius-md:8px;\n--radius-lg:16px;\n--radius-full:999px;\n\n--shadow-sm:0 1px 2px rgba(0,0,0,0.08);\n--shadow-md:0 4px 12px rgba(0,0,0,0.12);\n--shadow-lg:0 12px 32px rgba(0,0,0,0.18);\n\n--diagonal-angle:135deg; /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"5e76f95d-fed2-42d0-9560-843fa73e2267\"><\u002Fscript>\n<style>\nbody{margin:0;background:#FFFFFF}\na{color:#461D7C;font-weight:600}\na:hover{color:#222222}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:var(--font-body);color:#222222;font-size:16px;line-height:1.5\">\n<header style=\"background:#222222;color:#FFFFFF;padding:28px clamp(16px,4vw,48px)\">\n<div style=\"max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font-family:var(--font-display);font-size:24px;line-height:1;color:#FDD023\">8044 Denham Venom<\u002Fdiv>\n<h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:clamp(32px,5vw,48px);line-height:1.05;margin:0\">Student Status prototype · Review guide<\u002Fh1>\n<p style=\"margin:0;color:#EDEEEF;max-width:760px;text-wrap:pretty\">Instructions for reviewing the clickable prototype in a browser. Start here, then use the direct links below. The prototype uses sample data and saves nothing; reloading resets it.<\u002Fp>\n<nav aria-label=\"Pages\" style=\"display:flex;flex-wrap:wrap;gap:8px 18px;padding-top:6px\">\n<a href=\"index.html\" style=\"color:#FDD023\">Open the prototype<\u002Fa>\n<a href=\"flow-index.html\" style=\"color:#FDD023\">Flow index and permission matrix<\u002Fa>\n<a href=\"handheld-spec.html\" style=\"color:#FDD023\">Handheld spec (phone layouts, tokens, copy rules)<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"max-width:1000px;margin:0 auto;padding:32px clamp(16px,4vw,48px) 64px;display:flex;flex-direction:column;gap:40px\">\n\n<section data-screen-label=\"Source of truth\" style=\"display:flex;flex-direction:column;gap:10px\">\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:30px;margin:0\">Source of truth<\u002Fh2>\n<ol style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px\">\n<li>The “What changed in v2” section at the top of the <a href=\"flow-index.html\">Flow index<\u002Fa> overrides anything older on that page.<\u002Fli>\n<li>Behavior in the prototype is the intended design unless this guide lists it as prototype-only or not built.<\u002Fli>\n<li>Copy, status words and formats follow the “Copy and values” section of the <a href=\"handheld-spec.html\">Handheld spec<\u002Fa>.<\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<section data-screen-label=\"Using the prototype\" style=\"display:flex;flex-direction:column;gap:10px\">\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:30px;margin:0\">Using the prototype<\u002Fh2>\n<p style=\"margin:0\">A black bar across the top is a review tool, not part of the product. It contains:<\u002Fp>\n<ul style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px\">\n<li><strong>View as:<\u002Fstrong> Student, Parent, Coach, Travel Lead or Mentor. Each role has different navigation and actions.<\u002Fli>\n<li><strong>Sign-in flows:<\u002Fstrong> student sign-in, join with team code, waiting for approval, first-time profile, wrong Google account, archived student, parent invitation, expired invitation, mentor invitation.<\u002Fli>\n<li><strong>State:<\u002Fstrong> switches the current screen to Loading or Error.<\u002Fli>\n<li><strong>Financial editing:<\u002Fstrong> appears when viewing as Travel Lead; simulates the Coach granting that permission.<\u002Fli>\n<li><strong>Open decisions:<\u002Fstrong> lists decided and open items. Dashed “D#” tags in the interface open the related item.<\u002Fli>\n<\u002Ful>\n<p style=\"margin:0\">Pages also accept settings after <code>#<\u002Fcode> in the address, so any screen can be opened directly:<\u002Fp>\n<div style=\"background:#EDEEEF;border-radius:8px;padding:14px 16px;font-size:15px;display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:6px 16px\">\n<code>role<\u002Fcode><span>student, parent, coach, travel, mentor<\u002Fspan>\n<code>screen<\u002Fcode><span>status, events, event, finances, attendance, profile, parents, forms, team, student, readiness, drivers, fundraising, permissions, reports, enroll, adults, attsettings, season, settings, mreport, myprofile<\u002Fspan>\n<code>event<\u002Fcode><span>event id with screen=event, for example E1 (Regional 1)<\u002Fspan>\n<code>sid<\u002Fcode><span>student id with screen=student, for example D<\u002Fspan>\n<code>child<\u002Fcode><span>which linked student a parent views: A or D<\u002Fspan>\n<code>auth<\u002Fcode><span>signin, join, joinWait, onboarding, wrong, archived, invite, expired, mentorInvite<\u002Fspan>\n<code>theme<\u002Fcode><span>light or dark<\u002Fspan>\n<code>state<\u002Fcode><span>loading or error<\u002Fspan>\n<code>chrome=0<\u002Fcode><span>hides the review bar<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0\">Example: <a href=\"index.html#role=coach&amp;screen=event&amp;event=E1\">#role=coach&amp;screen=event&amp;event=E1<\u002Fa><\u002Fp>\n<p style=\"margin:0\">Phone layouts apply under 768px wide; full tables return at 1024px. Resize the window to test both.<\u002Fp>\n<\u002Fsection>\n\n<section data-screen-label=\"Sample data\" style=\"display:flex;flex-direction:column;gap:10px\">\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:30px;margin:0\">Sample people<\u002Fh2>\n<ul style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px\">\n<li><strong>Student A:<\u002Fstrong> the default student. On the Travel Team, has outstanding requirements and two room invitations for Regional 1.<\u002Fli>\n<li><strong>Parent A1:<\u002Fstrong> the default parent, linked to Student A and Student D.<\u002Fli>\n<li><strong>Student D:<\u002Fstrong> permission form sent back for correction (emergency contact phone).<\u002Fli>\n<li><strong>Student C:<\u002Fstrong> approved but has not completed first-time profile setup.<\u002Fli>\n<li><strong>Coach 1<\u002Fstrong> and <strong>Travel Lead 1:<\u002Fstrong> the default adults for those roles.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section data-screen-label=\"Review tasks\" style=\"display:flex;flex-direction:column;gap:12px\">\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:30px;margin:0\">Review tasks<\u002Fh2>\n<p style=\"margin:0\">Each task gives a starting link and the expected result.<\u002Fp>\n<sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"5\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<h3 style=\"font-family:var(--font-heading);font-weight:400;font-size:24px;margin:8px 0 0\">{{ g.role }}<\u002Fh3>\n<div style=\"border:1px solid #C9CCCF;border-radius:8px;overflow:hidden\">\n<sc-for list=\"{{ g.tasks }}\" as=\"t\" hint-placeholder-count=\"4\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:4px 20px;padding:12px 16px;border-top:1px solid #C9CCCF\">\n<div style=\"display:flex;flex-direction:column;gap:2px\"><strong>{{ t.task }}<\u002Fstrong><a href=\"{{ t.href }}\">{{ t.link }}<\u002Fa><\u002Fdiv>\n<span style=\"color:#3D3D3D\">{{ t.expect }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n\n<section data-screen-label=\"Not built\" style=\"display:flex;flex-direction:column;gap:10px\">\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:30px;margin:0\">Prototype-only or not built<\u002Fh2>\n<ul style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px\">\n<li>Google sign-in, the QR code and PDF downloads are stand-ins. PDF previews show intended contents.<\u002Fli>\n<li>Bulk financial update and spreadsheet import show their first screen only.<\u002Fli>\n<li>Permission and medication wording is placeholder text with a version number.<\u002Fli>\n<li>Time Clock import is simulated.<\u002Fli>\n<li>Changes are not saved and are not shared between reviewers.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section data-screen-label=\"Open and out of scope\" style=\"display:flex;flex-direction:column;gap:10px\">\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:30px;margin:0\">Still open<\u002Fh2>\n<ul style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px\">\n<li><strong>D6:<\u002Fstrong> final permission and medication authorization wording.<\u002Fli>\n<li><strong>D12:<\u002Fstrong> how Time Clock rows match students. The sheet uses names today.<\u002Fli>\n<li>The name and grouping of the Coach’s “Admin” group (Attendance, Season, Settings).<\u002Fli>\n<\u002Ful>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:30px;margin:12px 0 0\">Out of scope<\u002Fh2>\n<ul style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px\">\n<li>Automated emails, notifications and reminders.<\u002Fli>\n<li>Online payment collection and refund processing.<\u002Fli>\n<li>Ordinary users viewing past-season reports.<\u002Fli>\n<li>Automatic verification of external forms or FIRST registration.<\u002Fli>\n<li>Assigning students to specific vehicles, and separate outbound and return trips.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section data-screen-label=\"Feedback\" style=\"display:flex;flex-direction:column;gap:10px\">\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:30px;margin:0\">How to report findings<\u002Fh2>\n<p style=\"margin:0\">For each finding, give the role, the screen address (everything after <code>#<\u002Fcode>), the screen width, light or dark mode, what happened, and what was expected. Separate problems that break a requirement from suggestions.<\u002Fp>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const P = 'index.html#';\n    const t = (task, q, expect) => ({ task, href: P + q, link: '#' + q, expect });\n    const groups = [\n      { role: 'Student', tasks: [\n        t('Join the team', 'auth=join', 'Sign in with Google, enter the team code, first and last name, and confirm student. Ends on “Waiting for approval.”'),\n        t('Complete first-time profile', 'auth=onboarding', 'Wizard collects preferred name, shirt size, rooming category (Boys or Girls) and parent contact. Rooming category locks after saving.'),\n        t('See what is left to do', 'role=student&screen=status', 'To-do cards with due date, status chip and one button each. No attendance on this screen.'),\n        t('Choose roommates for Regional 1', 'role=student&screen=events', 'Overnight event cards offer Choose roommates or Change room. Two invitations wait; accepting closes the others. A test button shows another student taking the last spot first.'),\n        t('Invite a parent', 'role=student&screen=parents', 'Copy link or QR code. Links expire after 14 days and can be revoked.')\n      ]},\n      { role: 'Parent', tasks: [\n        t('Switch between students', 'role=parent&screen=status', '“Viewing: Student A” banner with 44px chips for Student A and Student D.'),\n        t('Fix a returned permission form', 'role=parent&screen=forms&child=D', 'Fix button jumps to the flagged emergency contact phone. Typed name must match the account. Ends on a receipt with the wording version.'),\n        t('Update health and medication choice', 'role=parent&screen=profile&child=A', 'Allergies and medications use None reported or Add. Over-the-counter authorization is one choice: Yes, Contact me first, or No.'),\n        t('Check payments', 'role=parent&screen=finances&child=A', 'One card per event: charge, applied, due. Pending events say “Fee applies if approved.” No editing.')\n      ]},\n      { role: 'Coach', tasks: [\n        t('Approve a join request', 'role=coach&screen=enroll', 'Create a team code (24 hours, 1 week, 2 weeks). Approve or decline requests; matches with archived students offer Reactivate.'),\n        t('Edit the roster', 'role=coach&screen=team', 'Inline subteam and Travel Team switch, missing-info summary, quick filters, bulk actions bar.'),\n        t('Create an event', 'role=coach&screen=events', 'Six steps: Basics, Who’s going (Travel Team, Required event, Open signup, Signup with approval), Costs, Requirements, Travel, Review.'),\n        t('Run an event', 'role=coach&screen=event&event=E1', 'Participants, requirements, transportation (drivers, bus, adults, trailer) and rooming. On phones, a section bar and one-line summaries.'),\n        t('Check event readiness and exports', 'role=coach&screen=readiness', '“Ready to go” only when student requirements, transportation and rooming are complete. Export previews for summary, rooms, permission slips and vehicles.'),\n        t('Record money', 'role=coach&screen=finances', 'Payments, refunds, adjustments with reasons, event and standalone charges, automatic credits in fee priority order, change history.'),\n        t('Manage adults', 'role=coach&screen=adults', 'Invite mentors, set Travel Lead and financial editing, review linked parents.'),\n        t('Close the season', 'role=coach&screen=season', 'Six steps, including per-student decisions on unpaid charges and departing balances.')\n      ]},\n      { role: 'Travel Lead', tasks: [\n        t('Review event readiness', 'role=travel&screen=readiness', 'Same as Coach. Cannot enroll students, edit profiles, manage adults or close seasons.'),\n        t('Manage drivers', 'role=travel&screen=drivers', 'Driver list with vehicle, seats, towing and active status. Mentors who drive appear here.'),\n        t('Try financial editing', 'role=travel&screen=finances', 'View-only until the Financial editing control in the review bar is turned on.')\n      ]},\n      { role: 'Mentor', tasks: [\n        t('Accept an invitation', 'auth=mentorInvite', 'Google sign-in, then My profile: shirt size required; driving, seats and towing optional; emergency contact optional.'),\n        t('View the team report', 'role=mentor&screen=mreport', 'Name, subteam, attendance summary, events and Ready or Not ready only. No finances, health, parent contacts or reasons.')\n      ]}\n    ];\n    return { groups };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
