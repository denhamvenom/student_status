  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

accent-text<\u002Fcode> carries purple text, links and outlines on dark surfaces. The old single value #8A63CC measured 3.59:1 on #222222 and 4.43:1 behind white.<\u002Fp>\n<div style=\"background:#fff;border:1px solid #C9CCCF;border-radius:8px;overflow:hidden\">\n<div style=\"display:grid;grid-template-columns:200px 1fr 1fr 1.4fr;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#5E5E5E;background:#EDEEEF\"><span style=\"padding:10px 14px\">Token<\u002Fspan><span style=\"padding:10px 14px\">Light<\u002Fspan><span style=\"padding:10px 14px\">Dark<\u002Fspan><span style=\"padding:10px 14px\">Use<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ tokens }}\" as=\"k\" hint-placeholder-count=\"10\"><div style=\"display:grid;grid-template-columns:200px 1fr 1fr 1.4fr;font-size:14px;border-top:1px solid #C9CCCF;align-items:center\">\n<code style=\"padding:10px 14px\">{{ k.name }}<\u002Fcode>\n<span style=\"padding:10px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:22px;border-radius:4px;border:1px solid #C9CCCF;background:{{ k.l }}\"><\u002Fspan>{{ k.l }} · <strong>{{ k.lc }}<\u002Fstrong><\u002Fspan>\n<span style=\"padding:10px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:22px;border-radius:4px;border:1px solid #C9CCCF;background:{{ k.d }}\"><\u002Fspan>{{ k.d }} · <strong>{{ k.dc }}<\u002Fstrong><\u002Fspan>\n<span style=\"padding:10px 14px;color:#3D3D3D\">{{ k.use }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:32px;margin:12px 0 0\">Type tokens<\u002Fh2>\n<div style=\"background:#fff;border:1px solid #C9CCCF;border-radius:8px;overflow:hidden\">\n<sc-for list=\"{{ type }}\" as=\"t\" hint-placeholder-count=\"7\"><div style=\"display:grid;grid-template-columns:220px 1fr 1.2fr;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid #C9CCCF;font-size:14px\"><code>{{ t.name }}<\u002Fcode><span style=\"font-family:{{ t.fam }};font-size:{{ t.size }};font-weight:{{ t.wt }};line-height:1.1\">{{ t.sample }}<\u002Fspan><span style=\"color:#3D3D3D\">{{ t.spec }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Breakpoints\" style=\"display:flex;flex-direction:column;gap:16px;max-width:1100px\">\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:40px;margin:0\">What changes at 768 and 1024px<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px\">\n<sc-for list=\"{{ bps }}\" as=\"b\" hint-placeholder-count=\"3\"><div style=\"background:#fff;border:1px solid #C9CCCF;border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px\"><strong style=\"font-family:var(--font-heading);font-weight:400;font-size:24px\">{{ b.range }}<\u002Fstrong><sc-for list=\"{{ b.items }}\" as=\"i\" hint-placeholder-count=\"5\"><span style=\"font-size:15px;line-height:1.4;padding-top:8px;border-top:1px solid #EDEEEF\">{{ i }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Copy and values\" style=\"display:flex;flex-direction:column;gap:16px;max-width:1100px\">\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:40px;margin:0\">Copy and values<\u002Fh2>\n<p style=\"font-size:16px;margin:0;text-wrap:pretty\">Every empty, missing or status value uses one of these words. Nothing else.<\u002Fp>\n<div style=\"background:#fff;border:1px solid #C9CCCF;border-radius:8px;overflow:hidden\">\n<sc-for list=\"{{ words }}\" as=\"w\" hint-placeholder-count=\"10\"><div style=\"display:grid;grid-template-columns:220px 1.4fr 1.4fr;gap:12px;padding:12px 14px;border-top:1px solid #C9CCCF;font-size:14px;align-items:start\"><strong>{{ w.word }}<\u002Fstrong><span>{{ w.when }}<\u002Fspan><span style=\"color:#3D3D3D\">{{ w.ex }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<h3 style=\"font-family:var(--font-heading);font-weight:400;font-size:28px;margin:8px 0 0\">Formats<\u002Fh3>\n<div style=\"background:#fff;border:1px solid #C9CCCF;border-radius:8px;overflow:hidden\">\n<sc-for list=\"{{ formats }}\" as=\"w\" hint-placeholder-count=\"6\"><div style=\"display:grid;grid-template-columns:220px 1fr;gap:12px;padding:12px 14px;border-top:1px solid #C9CCCF;font-size:14px\"><strong>{{ w.k }}<\u002Fstrong><span>{{ w.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<section data-screen-label=\"Checks\" style=\"display:flex;flex-direction:column;gap:16px;max-width:1100px\">\n<h2 style=\"font-family:var(--font-heading);font-weight:400;font-size:40px;margin:0\">Pass/fail status · phase 1<\u002Fh2>\n<div style=\"background:#fff;border:1px solid #C9CCCF;border-radius:8px;overflow:hidden\">\n<sc-for list=\"{{ checks }}\" as=\"c\" hint-placeholder-count=\"6\"><div style=\"display:grid;grid-template-columns:1.2fr 110px 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #C9CCCF;font-size:14px;align-items:start\"><span>{{ c.rule }}<\u002Fspan><strong style=\"color:{{ c.color }}\">{{ c.st }}<\u002Fstrong><span style=\"color:#3D3D3D\">{{ c.note }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const base = 'index.html#chrome=0&';\n    const P = (title, meta, w, h, q) => ({ title, meta, w: (w + 20) + 'px', h: (h + 20) + 'px', src: base + q });\n    const phones = [\n      P('Student home', '390 · light', 390, 844, 'role=student&screen=status'),\n      P('Student home', '390 · dark', 390, 844, 'role=student&screen=status&theme=dark'),\n      P('Student home', '360 · light', 360, 780, 'role=student&screen=status'),\n      P('Parent home, switcher', '390 · light · Viewing Student D', 390, 844, 'role=parent&screen=status&child=D'),\n      P('Parent home, switcher', '390 · dark', 390, 844, 'role=parent&screen=status&child=D&theme=dark'),\n      P('Permission wizard · correction', '390 · step 3, deep-linked field', 390, 844, 'role=parent&screen=forms&child=D&form=3'),\n      P('Permission wizard · typed name', '360 · dark · step 4', 360, 780, 'role=parent&screen=forms&child=D&form=4&theme=dark'),\n      P('Signed receipt', '390 · dark', 390, 844, 'role=parent&screen=forms&child=A&form=5&theme=dark'),\n      P('Per-event payment', '390 · light', 390, 844, 'role=parent&screen=finances&child=A'),\n      P('Invitation links', '360 · light · 14-day expiry', 360, 780, 'role=student&screen=parents'),\n      P('More sheet', '390 · dark', 390, 844, 'role=student&screen=status&more=1&theme=dark'),\n      P('Coach on phone', '390 · Event readiness', 390, 844, 'role=coach&screen=readiness'),\n      P('Loading state', '360', 360, 780, 'role=student&screen=status&state=loading'),\n      P('Error state', '360 · dark', 360, 780, 'role=student&screen=status&state=error&theme=dark')\n    ];\n    const desks = [\n      { title: 'Coach · grouped top bar · light', src: base + 'role=coach&screen=events' },\n      { title: 'Coach · finances table · dark', src: base + 'role=coach&screen=finances&theme=dark' }\n    ];\n    const ic = { home: 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z', events: 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4', money: 'M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6', profile: 'M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z', more: 'M5 12h.01M12 12h.01M19 12h.01' };\n    const navDemo = [['Home', 'home', 1], ['Events', 'events'], ['Money', 'money'], ['Profile', 'profile'], ['More', 'more']].map(([label, k, a]) => ({ label, icon: ic[k], bar: a ? 'var(--purple-700)' : 'transparent', color: a ? 'var(--purple-700)' : 'var(--text-muted)' }));\n    const themes = [{ id: 'light', label: 'Light' }, { id: 'dark', label: 'Dark' }];\n    const tokens = [\n      { name: '--surface-page', l: '#FFFFFF', d: '#161616', lc: 'base', dc: 'base', use: 'Page background' },\n      { name: '--surface-card', l: '#FFFFFF', d: '#222222', lc: 'base', dc: 'base', use: 'Cards, sheets, nav' },\n      { name: '--surface-metal', l: '#EDEEEF', d: '#2C2C2C', lc: 'base', dc: 'base', use: 'Switcher strip, neutral chips, skeletons' },\n      { name: '--text-body', l: '#222222', d: '#EDEEEF', lc: '15.91:1', dc: '13.70:1', use: 'Body text on card' },\n      { name: '--text-muted', l: '#6B6B6B', d: '#A9ADB2', lc: '5.33:1', dc: '7.05:1', use: 'Secondary text on card (light 4.59:1 on metal)' },\n      { name: '--accent-text (new)', l: '#461D7C', d: '#C3AEF2', lc: '12.16:1', dc: '8.07:1', use: 'Purple text, active nav, outline buttons' },\n      { name: '--purple-700', l: '#461D7C', d: '#6A40B5', lc: '12.16:1', dc: '6.97:1', use: 'Fill behind white text (chips, selected states)' },\n      { name: '--gold-500', l: '#FDD023', d: '#FDD023', lc: '10.78:1', dc: '10.78:1', use: 'Primary action fill with #222222 text' },\n      { name: '--gold-100', l: '#FFF3C4', d: '#3A3216', lc: '14.30:1', dc: '10.97:1', use: 'To-do and warning backgrounds with body text' },\n      { name: '--purple-100', l: '#E4D9F2', d: '#33254A', lc: '11.75:1', dc: '12.02:1', use: 'Success background with body text' },\n      { name: '--text-link', l: '#461D7C', d: '#FDD023', lc: '12.16:1', dc: '10.78:1', use: 'Links on card' },\n      { name: '--border-default', l: '#C9CCCF', d: '#4A4A4A', lc: 'non-text', dc: 'non-text', use: 'Dividers only; controls also carry a label or fill' }\n    ];\n    const type = [\n      { name: 'Display · Canaith', fam: 'var(--font-display)', size: '24px', wt: '400', sample: '8044 Denham Venom', spec: 'Wordmark only; 8044 and name same size' },\n      { name: 'H1 · Anton', fam: 'var(--font-heading)', size: '34px', wt: '400', sample: 'Permission form', spec: 'clamp(28px, 4vw, 40px)' },\n      { name: 'H2 · Anton', fam: 'var(--font-heading)', size: '24px', wt: '400', sample: 'To do · 3', spec: '24px section heading' },\n      { name: 'Card title · body', fam: 'var(--font-body)', size: '16px', wt: '700', sample: 'FIRST registration', spec: '16px / 700' },\n      { name: 'Body and inputs', fam: 'var(--font-body)', size: '16px', wt: '400', sample: 'Regional 1 · Due by Mar 4', spec: '15–16px body; inputs always 16px' },\n      { name: 'Label', fam: 'var(--font-body)', size: '12px', wt: '700', sample: 'CHARGE · APPLIED · DUE', spec: '12px / 700 uppercase, 0.05em' },\n      { name: 'Bottom nav label', fam: 'var(--font-body)', size: '12px', wt: '700', sample: 'Home  Events  Money', spec: '12px / 700 under a 22px icon' }\n    ];\n    const bps = [\n      { range: 'Under 768px', items: ['Bottom nav with 4 items plus More for each role; Sign out moves into More', 'Compact sticky header: mark, wordmark, theme toggle', 'Parent switcher strip under header with 44px chips', 'Cards for to-dos and payments; single column', 'Permission wizard hides the bottom nav and pins Back / Continue to the bottom'] },\n      { range: '768–1023px', items: ['Top nav returns: flat tabs for Student, Parent and Mentor; grouped bar for Coach and Travel Lead', 'Header shows signed-in name and role', 'Card grids go to two columns', 'Payment cards stay; tables still collapse to cards'] },\n      { range: '1024px and up', items: ['Full tables for adults: ledger, report, Drivers and readiness matrix', 'Grouped top bar with a second row for the active group', 'Card grids to three columns where space allows'] }\n    ];\n    const ok = 'var(--purple-700)', part = '#8A6D00';\n    const checks = [\n      { rule: 'No sideways scrolling at 390, 360, 844×390', st: 'Pass', color: ok, note: 'Under 1024px every table (roster, ledger, change history, report, Drivers, permission review, Users & Roles, fundraising entry, readiness matrix) becomes cards or an Outstanding-only list. PDF export previews keep print tables.' },\n      { rule: 'Tap targets 44px; inputs 16px; tel/email types', st: 'Pass', color: ok, note: 'Applied globally to inputs and selects. Phone and email fields use tel/email with autocomplete.' },\n      { rule: 'Contrast 4.5:1 in both themes', st: 'Pass', color: ok, note: 'Dark purple split into fill and text tokens (table above).' },\n      { rule: 'Status as text plus icon; specific button names', st: 'Pass', color: ok, note: 'Chips and readiness rows pair an icon with text. Repeated buttons (Accept, Revoke, Record payment, Edit, Remove access) name their person or item.' },\n      { rule: 'Primary actions in lower half', st: 'Pass', color: ok, note: 'Bottom nav, card buttons at card foot, wizard action bar pinned to bottom.' },\n      { rule: 'Empty, loading, error and success states', st: 'Pass', color: ok, note: 'Prototype bar → State switches any screen to Loading or Error. Empty: “All done”, “No active link”. Success: receipt and toasts.' }\n    ];\n    const words = [\n      { word: 'Not completed', when: 'Something a person must supply or finish has not been done.', ex: 'Shirt size, emergency contact, allergies, FIRST registration, medication authorization, room selection' },\n      { word: 'Completed', when: 'An adult-recorded requirement is done. Adds “· name” when recorded by someone.', ex: 'Completed · Coach 1' },\n      { word: 'None reported', when: 'Health fields only, when the parent or Coach checked it.', ex: 'Allergies: None reported' },\n      { word: 'None', when: 'A list that is legitimately empty.', ex: 'Outstanding: None · Events: None' },\n      { word: 'Not set', when: 'An optional setting or detail nobody has entered.', ex: 'Preferred name, destination, due date (“Due date not set”)' },\n      { word: 'Pending', when: 'Waiting on someone else’s action or approval.', ex: 'Pending approval, payment pending confirmation' },\n      { word: 'Not submitted / Needs correction / New signature requested / Accepted', when: 'Permission form status only.', ex: 'Permission form chip' },\n      { word: 'Waitlist', when: 'Event signup full; position shown.', ex: 'Waitlist · position 2' },\n      { word: 'Unavailable', when: 'Data could not be loaded or imported. Never used for zero.', ex: 'Attendance when the student is not in the Time Clock sheet' },\n      { word: 'Not applicable', when: 'A readiness area that does not apply to this event.', ex: 'Rooming on a day trip' },\n      { word: 'Paid / Balance due', when: 'Payment state on cards and requirements.', ex: 'Paid · Balance due' },\n      { word: '—', when: 'Tables and change history only: a cell with no value or no previous value.', ex: 'History “Previous: —”' }\n    ];\n    const formats = [\n      { k: 'Money', v: '$1,234.00 with cents always; negatives as −$20.00; zero as $0.00, never blank' },\n      { k: 'Dates', v: 'Oct 7, 2026. Short form Mar 4 only inside due-date chips.' },\n      { k: 'Date and time', v: 'Oct 7, 2026 · 7:12 PM' },\n      { k: 'Counts', v: '“3 of 8 spots taken”, “To do · 3”; singular when 1 (“1 student”)' },\n      { k: 'Percent', v: 'Whole numbers: 83%' },\n      { k: 'Buttons', v: 'Verb first, sentence case: “Record payment”, “Send for approval”. Repeated buttons carry the item in their accessible name.' }\n    ];\n    return { phones, desks, navDemo, themes, tokens, type, bps, checks, words, formats };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
